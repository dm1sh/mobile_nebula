# This workflow builds the Android app, just to check it builds without error

name: Smoke build
on:
  push:
    branches:
      - main
      - x86-32bit
  pull_request:
    types: [opened, synchronize, labeled, reopened]

jobs:
  build-android:
    name: Android
    runs-on: macos-26
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #6.0.2
        with:
          show-progress: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 #6.5.0
        with:
          go-version-file: nebula/go.mod
          cache: false
        id: go

      - name: Restore Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 #6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: smoke-android-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('nebula/go.sum') }}-${{ github.sha }}
          restore-keys: |
            smoke-android-go-${{ steps.go.outputs.go-version }}-${{ hashFiles('nebula/go.sum') }}-
            smoke-android-go-${{ steps.go.outputs.go-version }}-
            smoke-android-go-

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 #v5.2.0
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: "gradle"

      - name: Install flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e #v2.21.0
        with:
          flutter-version: '3.27.4'
          cache: true

      - name: install dependencies
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          flutter pub get
          touch env.sh

      - name: Install Android NDK 26 (required by Flutter 3.27.4)
        env:
          NDK_VERSION: "26.1.10909125"
        shell: bash
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/bin:$PATH"
          sdkmanager "ndk;${NDK_VERSION}"
          test -d "$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}"

      - name: flutter test
        run: |
          ./gen-artifacts.sh skip
          flutter test

      - name: Build Android debug
        run: flutter build apk --debug --target-platform=android-arm,android-arm64,android-x86

      - name: Collect debug apk
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f #6.0.0
        with:
          name: MobileNebulaDebug.apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 5
